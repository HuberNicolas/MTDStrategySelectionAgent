[project]
name = "mtd-strategy-selection-agent"
version = "3.0.0"
description = "Moving Target Defense (MTD) Strategy Selection Agent — Bachelor thesis, University of Zurich, 2022."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Nicolas Huber", email = "nicolas.huber.dev@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "psutil==5.9.0",
    "pyyaml",
    "requests",
    "setproctitle==1.2.2",
]

[project.optional-dependencies]
viz = ["matplotlib"]

[dependency-groups]
dev = ["ruff"]

# Reproduce the dependency versions as they were at the time of the thesis
# submission (last commit 2022-09-14), so the project resolves as it did then.
[tool.uv]
exclude-newer = "2022-09-15T00:00:00Z"

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["visualizations/**/*.ipynb", "**/data", "**/plots"]

[tool.ruff.lint]
# Errors, Pyflakes and import sorting only — no style modernisation of this
# 2022 code base.
select = ["E4", "E7", "E9", "F", "I"]
